name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://anaeyyikvoxwoefpxilf.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFuYWV5eWlrdm94d29lZnB4aWxmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTgzMDk2NDIsImV4cCI6MjA3Mzg4NTY0Mn0.Pw0DqG8r8UXtSc3KromZhX6qvuKl0mINnVT6X7Uo4t8' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFuYWV5eWlrdm94d29lZnB4aWxmIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc1ODMwOTY0MiwiZXhwIjoyMDczODg1NjQyfQ.DblHIOQvLvYlWWX-s-sZ7maHvYjZC6D4dUTRjEszRoo' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Supabase types
        run: |
          if [ -n "${{ secrets.SUPABASE_PROJECT_REF }}" ] && [ -n "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ]; then
            npx supabase gen types typescript --project-id ${{ secrets.SUPABASE_PROJECT_REF }} --schema public > src/types/database.types.ts
          else
            echo "Skipping Supabase type generation - secrets not configured"
          fi
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        continue-on-error: true

      - name: Run linting
        run: npm ci && npm run lint

      - name: Run ShellCheck for scripts
        if: always()
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck || true
          find . -type f -name "*.sh" -o -name "*.yml" | xargs -r shellcheck || true

      - name: Run type checking
        run: npm run type-check

      - name: Run unit tests
        run: npm run test:coverage -- --watchAll=false --passWithNoTests=false

      - name: Print npm debug log if failure
        if: failure()
        run: cat npm-debug.log || true

      - name: Run integration tests
        run: npm run test:integration
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}

      - name: Check code coverage threshold
        run: |
          set -e
          if [ ! -f ./coverage/coverage-summary.json ]; then
            echo "Coverage summary not found. Skipping coverage check."
            exit 0
          fi
          # Use node to safely read and print the coverage percentage
          COVERAGE=$(node -e "try{ const p=require('./coverage/coverage-summary.json'); console.log((p && p.total && p.total.lines && p.total.lines.pct) || 0); }catch(e){ console.error('Failed to read coverage-summary.json:', e.message); process.exit(0); }")
          echo "Code coverage is ${COVERAGE}%"
          # Minimum 60% for integration tests, allow CI to continue but warn
          if [ $(echo "${COVERAGE} < 60" | bc -l) -eq 1 ]; then
            echo "Warning: Code coverage is below 60% (${COVERAGE}%)"
          else
            echo "Code coverage meets minimum requirement: ${COVERAGE}%"
          fi

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info
          fail_ci_if_error: false
          verbose: true

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://test.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'test-anon-key' }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY || '' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || '' }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: hashFiles('playwright-report/**/*') != ''
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  deploy-staging:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel (Preview)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          scope: ${{ secrets.VERCEL_ORG_ID }}

  deploy-production:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Vercel (Production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod'
          scope: ${{ secrets.VERCEL_ORG_ID }}

      - name: Deploy Supabase Functions
        run: |
          npm install -g supabase
          supabase functions deploy --project-ref ${{ secrets.SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        continue-on-error: true

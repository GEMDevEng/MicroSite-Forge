name: E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  e2e:
    runs-on: ubuntu-latest

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://anaeyyikvoxwoefpxilf.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFuYWV5eWlrdm94d29lZnB4aWxmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTgzMDk2NDIsImV4cCI6MjA3Mzg4NTY0Mn0.Pw0DqG8r8UXtSc3KromZhX6qvuKl0mINnVT6X7Uo4t8' }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFuYWV5eWlrdm94d29lZnB4aWxmIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc1ODMwOTY0MiwiZXhwIjoyMDczODg1NjQyfQ.DblHIOQvLvYlWWX-s-sZ7maHvYjZC6D4dUTRjEszRoo' }}

    steps:
      # 1. Checkout repo
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Install Playwright browsers
      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # 5. Build, start app and run type-check
      - name: Build and start app
        run: |
          npm run build
          npm run start &
          npx wait-on http://localhost:3000/api/health

      - name: Type-check
        run: npm run type-check

      # 6. Run E2E tests
      - name: Run Playwright tests
        run: npm run test:e2e:ci

      # 6. Upload Playwright HTML report (optional)
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
